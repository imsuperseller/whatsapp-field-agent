# Installed to /etc/logrotate.d/waha-gateway by deploy/install.sh.
# These logs had no expiry until 2026-10. 30 days covers any "why did Bobot say
# that last week" question; nothing here needs to live longer.
# No copytruncate: every writer appends by path, so the next write after the
# rename opens a fresh file. The watchdog reads the fresh file from the start.
/opt/waha/logs/webhook.jsonl /opt/waha/logs/bridge.jsonl /opt/waha/logs/watchdog.jsonl {
  daily
  rotate 30
  maxage 30
  compress
  delaycompress
  missingok
  notifempty
}
